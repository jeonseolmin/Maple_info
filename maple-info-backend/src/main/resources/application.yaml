spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  docker:
    compose:
      enabled: false

  cache:
    type: caffeine
    cache-names:
      - activeEvents
    caffeine:
      spec: maximumSize=100,expireAfterWrite=1

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:maple_info_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

nexon:
  api:
    url: https://open.api.nexon.com
    key: ${NEXON_API_KEY}

gemini:
  api-key: ${GEMINI_API_KEY}

jwt:
  secret: ${JWT_SECRET}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}